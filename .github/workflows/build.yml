name: Cloud Release Builder

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - android

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    if: "${{ inputs.target == 'all' || inputs.target == 'macos' }}"
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS Release DMG
        env:
          NUVIO_MACOS_ARCH: arm64
        run: |
          touch local.properties
          ./gradlew clean :composeApp:packageReleaseDmg \
            -Pnuvio.macos.arch=arm64 \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-macOS-AppleSilicon-arm64
          path: composeApp/build/compose/release-dmgs/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish DMG to Release
        run: |
          gh release view latest || gh release create latest --title "Latest Release" --notes "Direct download of the latest application release." --prerelease
          gh release upload latest composeApp/build/compose/release-dmgs/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android Release APKs
    if: "${{ inputs.target == 'all' || inputs.target == 'android' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release Android APKs
        run: |
          touch local.properties
          ./gradlew clean :androidApp:assembleFullRelease \
            --no-daemon \
            --stacktrace

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-Android-APKs
          path: androidApp/build/outputs/apk/full/*/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android APKs to Release
        run: |
          gh release view latest || gh release create latest --title "Latest Release" --notes "Direct download of the latest application release." --prerelease
          gh release upload latest androidApp/build/outputs/apk/full/*/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
