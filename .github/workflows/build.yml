name: Cloud Release Builder

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - android

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    if: "${{ inputs.target == 'all' || inputs.target == 'macos' }}"
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS Release DMG
        env:
          NUVIO_MACOS_ARCH: arm64
        run: |
          touch local.properties
          ./gradlew clean :composeApp:packageReleaseDmg \
            -Pnuvio.macos.arch=arm64 \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-macOS-AppleSilicon-arm64
          path: composeApp/build/compose/release-dmgs/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "Direct download of the latest application release."
          prerelease: true
          overwrite: true
          files: composeApp/build/compose/release-dmgs/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android Release APKs
    if: "${{ inputs.target == 'all' || inputs.target == 'android' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release Android APKs
        run: |
          touch local.properties
          ./gradlew clean :androidApp:assembleFullRelease \
            --no-daemon \
            --stacktrace

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-Android-APKs
          path: androidApp/build/outputs/apk/full/*/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "Direct download of the latest application release."
          prerelease: true
          overwrite: true
          files: androidApp/build/outputs/apk/full/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
