name: Cloud Release Builder

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - android

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    if: "${{ inputs.target == 'all' || inputs.target == 'macos' }}"
    runs-on: macos-14

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS Release DMG
        env:
          NUVIO_MACOS_ARCH: arm64
        run: |
          touch local.properties
          ./gradlew clean :composeApp:packageReleaseDmg \
            -Pnuvio.macos.arch=arm64 \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-macOS-AppleSilicon-arm64
          path: composeApp/build/compose/release-dmgs/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android Release APKs
    if: "${{ inputs.target == 'all' || inputs.target == 'android' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          repository: Souma-Sama/desktop-runtime
          ref: Dev
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release Android APKs
        run: |
          touch local.properties
          ./gradlew clean :androidApp:assembleFullRelease \
            --no-daemon \
            --stacktrace

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Kai-Android-APKs
          path: androidApp/build/outputs/apk/full/*/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release Assets
    needs: [build-macos, build-android]
    if: always() && !cancelled() && (needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Nuvio-Kai-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.apk" -o -name "*.dmg" \) -exec cp {} dist/ \;
          echo "=== Clean files ready for upload ==="
          ls -lh dist/

      - name: Publish Assets to Release
        run: |
          gh release view latest --repo ${{ github.repository }} || gh release create latest --title "Latest Release" --notes "Direct download of the latest application release." --prerelease --repo ${{ github.repository }}
          
          for file in dist/*; do
            echo "----------------------------------------"
            echo "Uploading $file..."
            for attempt in 1 2 3; do
              if gh release upload latest "$file" --clobber --repo ${{ github.repository }}; then
                echo "Successfully uploaded $file"
                break
              fi
              echo "Attempt $attempt failed for $file. Retrying in 5 seconds..."
              sleep 5
              if [ $attempt -eq 3 ]; then
                echo "Failed to upload $file after 3 attempts."
                exit 1
              fi
            done
          done
          echo "All release assets uploaded successfully!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
